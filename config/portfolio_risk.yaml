paths:
  portfolio_xlsx: "Data/Portfolio.xlsx"   # confirmado 23/07/2026: fica direto em Data/, não Data/raw/
  output_dir: "Data/processed"

# Confirmado pela planilha real (22/07/2026): aba "Summary" com colunas
# Classe | Ativo | BBG | Tipo | Posição. Ajuste "sheet" se o nome da aba
# for outro na sua planilha.
sheet: "Summary"

# Uma linha por ativo. Tipo deve ser "Notional" ou "DV01" (case-insensitive):
#   - Notional: BBG aponta para um preço/nível (futuro, ação, FX, índice) e
#     Posição é o valor de mercado em $ da posição (ex: ES1 Index, $10,000,000).
#   - DV01: BBG aponta para uma taxa/yield cotada em % (mesma convenção dos
#     tickers de curva do projeto emrates) e Posição é o DV01 em $/bp — ver
#     o aviso de convenção de sinal em src/riskvar/pnl_series.py.
# "asset_class" é opcional (usada só como rótulo, não entra na conta) — se a
# sua planilha não tiver essa coluna, remova a linha abaixo sem problema.
columns:
  asset_class: "Classe"
  asset: "Ativo"
  ticker: "BBG"
  position_type: "Tipo"
  position_value: "Posição"

# Histórico de preços/taxas: lido direto da aba "Preços" (confirmado
# 23/07/2026), preenchida no Excel via =BDH(...) da Bloomberg -- não
# depende de sessão Bloomberg em Python (BBComm/xbbg), que se mostrou
# instável. "ticker_row_label" é o rótulo na coluna A que identifica a
# linha com os tickers BBG (mesma string usada em columns.ticker acima,
# pra casar posição com histórico). Células "#N/A N/A" (sem cotação
# naquele dia) são descartadas automaticamente -- ver price_history.py.
price_history:
  sheet: "Preços"
  ticker_row_label: "BBG"

# Janelas de estimação (lookback) em dias úteis — não é o horizonte do VaR
# em si (que continua sendo 1 dia), é quantos dias de histórico entram na
# amostra usada pra estimar vol/VaR. ~21 dias úteis/mês.
lookback_windows:
  3M: 63
  12M: 252

confidence_levels: [0.95]

trading_days_per_year: 252

base_currency: "USD"   # só usado como rótulo no relatório HTML
