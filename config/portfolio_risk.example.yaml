# TEMPLATE compartilhado com a mesa -- este arquivo (portfolio_risk.example.yaml)
# fica versionado no git, igual pra todo mundo. Seu config de verdade é uma
# CÓPIA dele chamada "portfolio_risk.yaml" (sem ".example"), na mesma pasta
# config/ -- esse nome é ignorado pelo git (.gitignore) de propósito, pra
# cada trader poder apontar pro caminho/aba/colunas da SUA própria planilha
# sem nunca sobrescrever o config de outra pessoa nem precisar dar commit
# toda vez que muda algo local.
#
# Primeira vez rodando isso na sua máquina:
#   1. copie este arquivo pra config/portfolio_risk.yaml
#   2. edite paths.portfolio_xlsx (e sheet/columns abaixo, se sua planilha
#      usar nomes diferentes de aba/coluna)
#   3. rode: python scripts/run_var.py
#
# O motor de cálculo (src/riskvar/) é o mesmo pra todo mundo -- só esse
# arquivo muda de trader pra trader.

paths:
  portfolio_xlsx: "Data/Portfolio.xlsx"   # caminho da SUA planilha de portfólio
  output_dir: "Data/processed"

# Confirmado pela planilha real (22/07/2026): aba "Summary" com colunas
# Classe | Ativo | BBG | Tipo | Posição. Ajuste "sheet" se o nome da aba
# for outro na sua planilha.
sheet: "Summary"

# Uma linha por ativo. Tipo deve ser "Notional" ou "DV01" (case-insensitive):
#   - Notional: BBG aponta para um preço/nível (futuro, ação, FX, índice) e
#     Posição é o valor de mercado em $ da posição (ex: ES1 Index, $10,000,000).
#   - DV01: BBG aponta para uma taxa/yield cotada em % (mesma convenção dos
#     tickers de curva do projeto emrates) e Posição é o DV01 em $/bp — ver
#     o aviso de convenção de sinal em src/riskvar/pnl_series.py.
# "asset_class" é opcional (usada só como rótulo, não entra na conta) — se a
# sua planilha não tiver essa coluna, remova a linha abaixo sem problema.
columns:
  asset_class: "Classe"
  asset: "Ativo"
  ticker: "BBG"
  position_type: "Tipo"
  position_value: "Posição"

# Histórico de preços/taxas: lido direto da aba "Preços" (confirmado
# 23/07/2026), preenchida no Excel via =BDH(...) da Bloomberg -- não
# depende de sessão Bloomberg em Python (BBComm/xbbg), que se mostrou
# instável. "ticker_row_label" é o rótulo na coluna A que identifica a
# linha com os tickers BBG (mesma string usada em columns.ticker acima,
# pra casar posição com histórico). Células "#N/A N/A" (sem cotação
# naquele dia) são descartadas automaticamente -- ver price_history.py.
price_history:
  sheet: "Preços"
  ticker_row_label: "BBG"

# Janelas de estimação (lookback) em dias úteis — não é o horizonte do VaR
# em si (que continua sendo 1 dia), é quantos dias de histórico entram na
# amostra usada pra estimar vol/VaR. ~21 dias úteis/mês.
lookback_windows:
  3M: 63
  12M: 252

confidence_levels: [0.95, 0.99]   # mais de uma confiança aparece lado a lado nos tiles e na tabela detalhada

trading_days_per_year: 252

base_currency: "USD"   # só usado como rótulo no relatório HTML

# Stress test por sensibilidade a fatores macro -- OPCIONAL. Se as duas
# chaves abaixo (stress_factors/stress_scenarios) não estiverem aqui, ou
# se algum ticker de fator não tiver histórico na aba "Preços", o relatório
# só imprime um aviso e pula essa seção -- não quebra o resto do script.
#
# Isso é DIFERENTE de cravar cenários de eventos históricos reais (Taper
# Tantrum, COVID etc.) -- é sensibilidade estatística contínua (regressão
# linear do P&L do portfólio contra os fatores, ajustada na mesma janela
# de 12M), então qualquer choque numérico já é calculável direto.
#
# Cada fator precisa do próprio histórico como mais uma coluna na MESMA
# aba "Preços" (price_history acima) -- mesmo mecanismo =BDH(...) de
# sempre, só que sem entrar na aba "Summary" de posições (fator não é uma
# posição do book, é só uma referência).
stress_factors:
  spx:
    ticker: "SPX Index"
    kind: pct_return       # fator é um preço/nível -- variação diária = retorno %
  ust10y:
    ticker: "USGG10YR Index"
    kind: bps_change       # fator é uma taxa/yield cotada em % -- variação diária = bps
  brent:
    ticker: "CO1 Comdty"   # futuro genérico de Brent (1º vencimento) -- confirme o ticker exato na sua planilha
    kind: pct_return

# "shocks" usa a MESMA unidade do fator (pct_return em decimal: -0.05 =
# -5%; bps_change em bps: 20 = +20bps). Um cenário pode combinar vários
# fatores -- o impacto final é a soma linear de cada choque.
stress_scenarios:
  - name: "S&P -5%"
    shocks: {spx: -0.05}
  - name: "UST10y +20bps"
    shocks: {ust10y: 20}
  - name: "Risk-off combinado"
    shocks: {spx: -0.05, ust10y: 20}
  - name: "Brent +20%"
    shocks: {brent: 0.20}
