country: colombia
central_bank:
  committee: "Junta Directiva — Banco de la República (BanRep)"
  meeting_frequency: "12 reuniões/ano, mas só 8 com decisão de taxa"

reference_instrument: "Swap IBR (OIS)"
floating_index: "IBR (Indicador Bancario de Referencia)"
index_type: overnight_compounded

pillar_type: zero_rate             # bullet para prazos curtos — VERIFICAR corte de prazo/frequência para tenores longos
day_count: ACT/360
compounding: exponential
coupon_frequency_months: null
fixing_lag_days: 1                 # IBR overnight fixado/leiloado em D às ~11h, mas vigora para o dia seguinte (t+1)
min_pillar_tenor_days: 45           # exclui CLSWIBA (~1M): liquidez considerada baixa demais pra confiar (Ricardo, 22/07/2026)

benchmark_transition: null         # IBR vigente desde 2008, sem descontinuação identificada

bloomberg:
  curve_family: "CLSWIB — confirmado via inspect_bbg_tickers.py (CLSWIBA...CLSWIB10 BGN Curncy)"
  security_typ2: "FIXED_FLOAT_OIS"
  maturity_source: "campo MATURITY direto (não precisa parsear o ticker)"
  confidence: alta
  tickers_confirmados_2026-07-20:
    - "CLSWIBA BGN Curncy -> 2026-08-22"
    - "CLSWIBC BGN Curncy -> 2026-10-22"
    - "CLSWIBF BGN Curncy -> 2027-01-22"
    - "CLSWIBI BGN Curncy -> 2027-04-22"
    - "CLSWIB1 BGN Curncy -> 2027-07-22"
    - "CLSWIB1F BGN Curncy -> 2028-01-22"
    - "CLSWIB2..IB10 BGN Curncy -> anual até 2036-07-22"

sources:
  - "BanRep — Overnight Interbank Rate (IBR), glossário"
  - "BanRep — Manual de uso del IBR"
  - "day_count revisado 21/07/2026: COP-IBR-OIS-COMPOUND permite ACT/360 OU ACT/365F por contrato (não há um único padrão universal) — ACT/360 é descrito como o mais comum, mantido aqui, mas com confiança menor que Chile/Czech/Mexico."

notes:
  - "Particularidade de fixing: a taxa IBR publicada no dia D é para vigência em D+1 — atenção ao alinhar isso no motor de acumulação (calendars.py / bootstrap), diferente de Brasil/Chile onde a taxa do dia vale para o próprio dia."
  - "VERIFICAR: frequência de cupom para tenores mais longos (1Y+) — fontes públicas não confirmaram o corte exato entre bullet e periódico."
  - "22/07/2026: Colômbia não tem FRA de IBR na planilha (confirmado com o Ricardo) — sem alternativa granular tipo Czech/Poland/Hungary. priced_bc usa strip_meeting_path_from_pillars (lê os pilares reais do swap direto, sem NSS) em vez do caminho smoothed — ver run_daily_pricing.py e central_banks/stripper.py."
