country: mexico
central_bank:
  committee: "Junta de Gobierno — Banxico"
  meeting_frequency: "8x/ano, ~6-7 semanas de intervalo"

reference_instrument: "Swap de TIIE de Fondeo (F-TIIE) — padrão para novas operações desde 01/jan/2025"
floating_index: "TIIE de Fondeo a un Día"
index_type: overnight_compounded   # composição diária + spread de ajuste de 24bps vs a antiga TIIE 28d

pillar_type: par_swap              # cupom periódico a cada 28 dias corridos
day_count: ACT/360                 # VERIFICAR — uso corrente de mercado, não confirmado em doc primário
compounding: exponential
coupon_frequency_months: 1         # aproximação mensal do período de 28 dias — VERIFICAR e ajustar p/ dias corridos se necessário
fixing_lag_days: 0                 # TIIE de Fondeo de D é publicada por Banxico às 17h do próprio dia D

benchmark_transition:
  status: "concluída em 01/jan/2025"
  detail: "Banxico proibiu novas operações referenciadas à TIIE 28 dias; contratos legados permanecem, mas o benchmark vigente para novos trades é a TIIE de Fondeo (F-TIIE), com spread de +24bps sobre a taxa composta."

bloomberg:
  curve_family: "VERIFICAR — 'MPSW' não confirmado em fonte pública, checar no terminal"
  confidence: baixa

sources:
  - "BMV — Swap de TIIE de Fondeo y Conversión de Tasas"
  - "Banxico — TIIE de Fondeo a Un Día Hábil Bancario"

notes:
  - "Se o book tiver posições legadas em TIIE 28d (pré-2025), tratar como curva separada — não misturar com F-TIIE."
  - "coupon_frequency_months=1 é aproximação; o período real é de 28 dias corridos, não mensal — considerar gerar o schedule em dias corridos se a precisão de 28d vs ~30d importar para o book."
