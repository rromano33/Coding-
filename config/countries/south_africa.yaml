country: south_africa
central_bank:
  committee: "Monetary Policy Committee (MPC) — SARB"
  meeting_frequency: "6x/ano (bimestral)"

# MUDANÇA IMPORTANTE (20/07/2026): os tickers reais da planilha (SAOIAA...,
# tipo FIXED_FLOAT_OIS confirmado via inspect_bbg_tickers.py) NÃO batem com o
# swap JIBAR 3M a termo que a pesquisa original assumiu — o nome e o tipo
# apontam para a curva OIS de ZARONIA (a nova taxa overnight, substituta do
# JIBAR, cuja transição está em andamento). Tratando como OIS por ora;
# CONFIRMAR com a mesa se o book realmente referencia ZARONIA e não JIBAR.
reference_instrument: "Swap OIS ZARONIA (tickers SAOIAA...) — a confirmar com a mesa"
floating_index: "ZARONIA (South African Rand Overnight Index Average)"
index_type: overnight_compounded

pillar_type: zero_rate              # bullet — mesma incerteza de Chile/Colômbia para tenores longos (só 10Y confirmado, sem doc de frequência de cupom)
day_count: ACT/365                  # CONFIRMADO 21/07/2026 — SARB "Market conventions for ZARONIA" e o contrato ZARONIA-OIS-Compound
                                     # publicado no Bloomberg SEF: ZARONIA é cotado/composto em ACT/365. Coincide com o herdado do JIBAR.
compounding: exponential
coupon_frequency_months: null
fixing_lag_days: 0                  # ainda VERIFICAR — pesquisa confirmou day_count, mas não achei o fixing lag específico de ZARONIA

benchmark_transition:
  status: "em andamento — confirmado, com cronograma"
  detail: "SARB anunciou em 03/dez/2025 a cessação definitiva de todos os tenores do JIBAR após a última publicação em 31/12/2026, substituído por ZARONIA (overnight RFR). Os tickers da planilha do usuário já parecem ser a curva ZARONIA (SAOIAA, FIXED_FLOAT_OIS), não JIBAR — ou seja, a transição já está refletida no book."
  action_item: "day_count confirmado (ACT/365, ver acima). Ainda falta confirmar com a mesa se SAOIAA é mesmo ZARONIA e o fixing lag específico."

bloomberg:
  curve_family: "SAOIAA — confirmado via inspect_bbg_tickers.py (SAOIAAA...SAOIAA10 BGN Curncy)"
  security_typ2: "FIXED_FLOAT_OIS"
  maturity_source: "campo MATURITY direto (não precisa parsear o ticker)"
  confidence: alta_para_ticker_media_para_convencao
  tickers_confirmados_2026-07-20:
    - "SAOIAAA BGN Curncy -> 2026-08-20"
    - "SAOIAAB BGN Curncy -> 2026-09-20"
    - "SAOIAAC..SAOIAAI BGN Curncy -> mensal até 2027-04-20"
    - "SAOIAA1..SAOIAA10 BGN Curncy -> anual até 2036-07-20"

sources:
  - "SARB — JIBAR"
  - "SARB MPG — Transition Approach Recommendations 2026"
  - "ISDA — JIBAR Cessation Guidance (dez/2025)"
  - "SARB — Market conventions for ZARONIA-linked loans (working draft): ZARONIA cotado em ACT/365"
  - "Bloomberg SEF — ZAR ZARONIA-OIS-Compound Fixed-to-Floating IRS contract (mar/2025)"

notes:
