  - "JIBAR legado: reference_instrument='Swap JIBAR 3M (ZAR-JIBAR-SAFEX)', index_type=term_rate, pillar_type=par_swap, coupon_frequency_months=3, cotação em base NACQ (Nominal Annual Compounded Quarterly)."
