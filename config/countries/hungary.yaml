  - "GAP DE COBERTURA: só há 5 pilares confirmados (1,2,3,5,10Y) — nada abaixo de 1 ano. A planilha também tem tickers de FRA (HFFR...) que dariam ponta curta, ainda não integrados ao motor (sem campo MATURITY direto). Note também que o 1º ticker é 'HFSW1VC' (sufixo diferente dos demais 'HFSW2'..'HFSW10') — confirmar se isso é só uma particularidade de nomenclatura do tenor 1Y ou algo distinto."
