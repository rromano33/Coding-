country: hungary
central_bank:
  committee: "Monetáris Tanács (Monetary Council) — MNB"
  meeting_frequency: "mensal"

reference_instrument: "Swap BUBOR / BIRS (Budapest Interest Rate Swap)"
floating_index: "BUBOR 6M"
index_type: term_rate

pillar_type: par_swap
day_count: ACT/360                 # perna BUBOR; BIRS (taxa fixa) cotado em ACT/365 — VERIFICAR se o motor precisa de day count distinto por perna
compounding: exponential
coupon_frequency_months: 6         # flutuante semestral; fixa anual
fixing_lag_days: 2                 # spot lag T-2, fixing às 11h

benchmark_transition: null         # sem reforma regulatória compulsória identificada; HUFONIA existe como RFR desde 2016 mas não é mandatório

bloomberg:
  curve_family: "HFSW (Annual Settlement & Compounding vs 6M BUBOR) — confiança moderada, fonte não primária"
  confidence: media

sources:
  - "MNB — BIRS Regulation"
  - "MNB — BUBOR Regulation"
  - "MNB — administrador de BUBOR/BIRS/HUFONIA desde nov/2016"

notes:
  - "Particularidade: BUBOR (perna flutuante) e BIRS (fixação/perna fixa do swap) usam day counts diferentes (ACT/360 vs ACT/365) — o motor genérico hoje assume um único day_count por curva; se isso importar para o book, tratar como refinamento futuro."
