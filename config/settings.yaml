# Caminhos e mapeamento de colunas — confirmado contra o Input_BCs.xlsx real
# via scripts/inspect_inputs.py em 20/07/2026.

paths:
  inputs_bcs: "Data/Input_BCs.xlsx"
  bbg_cache_dir: "Data/raw"
  processed_dir: "Data/processed"

sheets:
  tickers_sheet: "Tickers"
  dates_sheet: "Dates"
  positions_sheet: "Posições"

tickers_columns:
  country: "Country"
  kind: "Type"          # valores confirmados: "Policy" | "Curve"
  description: "Description"
  ticker: "Ticker"

# Aba 'Dates' é larga: uma coluna por comitê (reuniões) e uma por país
# (feriados), cada uma uma lista independente de datas, não alinhada por
# linha entre colunas.
dates_columns:
  meetings:
    BANXICO: mexico
    BCCh: chile
    Banrep: colombia
    BCB: brazil
    SARB: south_africa
    NBP: poland
    CNB: czech
    MNB: hungary
  # Nomes confirmados contra o print de 21/07/2026 (aba Dates, colunas I-P).
  # O casing é inconsistente entre colunas na planilha real (Feriados_Brazil
  # com B maiúsculo, as demais minúsculas) — o loader casa por nome
  # ignorando maiúsculas/minúsculas (ver excel_loader.py), então isso aqui
  # não precisa bater char-a-char, só o nome em si.
  holidays:
    Feriados_mexico: mexico
    Feriados_chile: chile
    Feriados_Banrep: colombia
    Feriados_Brazil: brazil
    Feriados_south_africa: south_africa
    Feriados_poland: poland
    Feriados_czech: czech
    Feriados_hungary: hungary

positions_columns:
  # já existe na planilha com exatamente este layout (aba "Posições", vazia por ora)
  TradeID: "TradeID"
  Country: "Country"
  TradeDate: "TradeDate"
  StartDate: "StartDate"
  MaturityDate: "MaturityDate"
  PayReceive: "PayReceive"   # "pay" | "receive" (perna fixa)
  Notional: "Notional"
  FixedRate: "FixedRate"
  Currency: "Currency"

bloomberg:
  default_field: "PX_LAST"

reporting:
  # Limita o priced_bc a essa quantidade de próximas reuniões. A aba Dates
  # tem séries de reunião bem mais longas que o calendário real confirmado
  # de cada BC (a maioria não confirma datas além de 1-2 anos à frente) —
  # sem esse limite, reuniões distantes acabam usando a curva extrapolada
  # além do último vencimento real de mercado, o que não é precificação
  # confiável. Ajuste esse número se quiser ver mais/menos à frente.
  meetings_horizon: 12
