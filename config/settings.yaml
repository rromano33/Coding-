# Caminhos e mapeamento de colunas — confirmado contra o Input_BCs.xlsx real
# via scripts/inspect_inputs.py em 20/07/2026.

paths:
  inputs_bcs: "Data/Input_BCs.xlsx"
  bbg_cache_dir: "Data/raw"
  processed_dir: "Data/processed"

sheets:
  tickers_sheet: "Tickers"
  dates_sheet: "Dates"
  positions_sheet: "Posições"

tickers_columns:
  country: "Country"
  kind: "Type"          # valores confirmados: "Policy" | "Curve"
  description: "Description"
  ticker: "Ticker"

# Aba 'Dates' é larga: uma coluna por comitê (reuniões) e uma por país
# (feriados), cada uma uma lista independente de datas, não alinhada por
# linha entre colunas.
dates_columns:
  meetings:
    BANXICO: mexico
    BCCh: chile
    Banrep: colombia
    BCB: brazil
    SARB: south_africa
    NBP: poland
    CNB: czech
    MNB: hungary
  holidays:
    Feriados_mexico: mexico
    Feriados_chile: chile
    Feriados_Brazil: brazil
    Feriados_ZAR: south_africa
    Feriados_PLN: poland
    Feriados_CZK: czech
    Feriados_HUF: hungary
    # Feriados da Colômbia: não encontrei essa coluna na planilha (só as 7
    # acima apareceram) — confirmar com o Ricardo se existe com outro nome
    # (ex: Feriados_COP) ou se falta adicionar.

positions_columns:
  # já existe na planilha com exatamente este layout (aba "Posições", vazia por ora)
  TradeID: "TradeID"
  Country: "Country"
  TradeDate: "TradeDate"
  StartDate: "StartDate"
  MaturityDate: "MaturityDate"
  PayReceive: "PayReceive"   # "pay" | "receive" (perna fixa)
  Notional: "Notional"
  FixedRate: "FixedRate"
  Currency: "Currency"

bloomberg:
  default_field: "PX_LAST"
